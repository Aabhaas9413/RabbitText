# ─────────────────────────────────────────────────────────────────────────────
# Alpha CQRS Notification Platform — Docker Compose
# Supports switching between RabbitMQ and Kafka via MESSAGING_PROVIDER:
#   Default (RabbitMQ): docker-compose up --build
#   Kafka mode        : $env:MESSAGING_PROVIDER="Kafka"; docker-compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── RabbitMQ ──────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: alpha-rabbitmq
    hostname: alpha-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP protocol port
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - alpha-network

  # ── Apache Kafka (KRaft mode — no ZooKeeper) ──────────────────────────────
  kafka:
    image: apache/kafka:3.8.1
    container_name: alpha-kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    networks:
      - alpha-network

  # ── Notification Sender (Command Side) ────────────────────────────────────
  notification-sender:
    build:
      context: .
      dockerfile: src/NotificationSender/Dockerfile
    container_name: alpha-notification-sender
    image: alpha/notification-sender:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_HTTP_PORTS=8080
      - Messaging__Provider=${MESSAGING_PROVIDER:-RabbitMQ}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__Topic=notification-created
    ports:
      - "5001:8080"   # HTTP exposed on host port 5001
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - alpha-network

  # ── Notification Receiver (Query Side) ────────────────────────────────────
  notification-receiver:
    build:
      context: .
      dockerfile: src/NotificationReceiver/Dockerfile
    container_name: alpha-notification-receiver
    image: alpha/notification-receiver:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/notifications.db
      - Messaging__Provider=${MESSAGING_PROVIDER:-RabbitMQ}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__Topic=notification-created
    volumes:
      - ./data/receiver:/app/data
    ports:
      - "5002:8080"   # HTTP exposed on host port 5002
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - alpha-network

# ─── Shared Volumes ───────────────────────────────────────────────────────────
volumes:
  rabbitmq-data:
    driver: local

# ─── Shared Network ───────────────────────────────────────────────────────────
networks:
  alpha-network:
    driver: bridge
