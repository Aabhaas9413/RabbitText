# ─────────────────────────────────────────────────────────────────────────────
# Alpha CQRS Notification Platform — Docker Compose
# Topology: RabbitMQ → NotificationSender (Command) → NotificationReceiver (Query)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── RabbitMQ ──────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: alpha-rabbitmq
    hostname: alpha-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP protocol port
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - alpha-network

  # ── Notification Sender (Command Side) ────────────────────────────────────
  notification-sender:
    build:
      context: .
      dockerfile: src/NotificationSender/Dockerfile
    container_name: alpha-notification-sender
    image: alpha/notification-sender:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_HTTP_PORTS=8080
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    ports:
      - "5001:8080"   # HTTP exposed on host port 5001
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - alpha-network

  # ── Notification Receiver (Query Side) ────────────────────────────────────
  notification-receiver:
    build:
      context: .
      dockerfile: src/NotificationReceiver/Dockerfile
    container_name: alpha-notification-receiver
    image: alpha/notification-receiver:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/notifications.db
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    volumes:
      - ./data/receiver:/app/data
    ports:
      - "5002:8080"   # HTTP exposed on host port 5002
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - alpha-network

# ─── Shared Volumes ───────────────────────────────────────────────────────────
volumes:
  rabbitmq-data:
    driver: local

# ─── Shared Network ───────────────────────────────────────────────────────────
networks:
  alpha-network:
    driver: bridge
