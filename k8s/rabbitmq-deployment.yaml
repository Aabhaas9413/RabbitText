---
# ─────────────────────────────────────────────────────────────────────────────
# RabbitMQ — Kubernetes Manifests
# Includes: Secret, ConfigMap, StatefulSet, Services
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: mango
  labels:
    app: rabbitmq
    component: messaging
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: guest
  RABBITMQ_DEFAULT_PASS: guest

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: mango
data:
  RABBITMQ_VM_MEMORY_HIGH_WATERMARK: "0.6"

---
# StatefulSet ensures stable network identity and persistent storage
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: mango
  labels:
    app: rabbitmq
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          envFrom:
            - secretRef:
                name: rabbitmq-secret
            - configMapRef:
                name: rabbitmq-config
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "status"]
            initialDelaySeconds: 40
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

---
# Headless service for stable DNS within the cluster
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: mango
  labels:
    app: rabbitmq
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672

---
# Standard ClusterIP service for application connectivity
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: mango
  labels:
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
